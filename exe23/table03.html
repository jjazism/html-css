<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de células</title>
</head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            width: 500px;
            border-collapse: collapse;
            
        }

        td {
            border: 1px black solid;
            padding: 10px;
            text-align: center;
        }
    </style>
    
    <!-- 
        colspam = para expandir as colunas / Utilize a expansão em forma de COLUNA quando a célula vizinha, aquela que você deletou, estiver ao lado (esquerdo ou direito) da célula que irá ser expandida 

        rowspan = para expandir as linhas / Utilize a expansão em forma de LINHA quando a célula vizinha, aquela que você deletou, estiver embaixo (nunca em cima) da célula que irá ser expandida

    -->

<body>  
    <h1>Mesclagem de Células</h1>

    <table>

        <tr>
            <td colspan="2">A</td>
            
            <td rowspan="2" colspan="2">B</td>
        </tr>

        <tr>
            <td>C</td>
            <td >D</td>
        </tr>

        <tr>
            <td>E</td>
            <td colspan="2">F</td>
            <TD>G</TD>
            
        </tr>



    </table>
    
</body>
</html>
