<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Grandes</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    td, th {
        border: 1px black solid;
        padding: 10px;
    }

    table {
        width: 800px;
        border-collapse: collapse;
    }

    caption {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 1.6em;
        font-weight: bold;
        padding: 10px;
        background-color: lightgray;
        border-radius: 5px;
    }

    th {
        background-color: gray;
        color: white;
    }

    td {
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif

    }

    tbody tr:nth-child(ODD) {            /* odd = IMPAR even = PAR           */
        background-color: yellow;
    }


    thead th.pop {
        width: 200px
    }

    thead th.est {
        width: 600px;
    }

    .numero {
        font-family: 'Courier New', Courier, monospace;
        text-align: right;
        background-color: rgb(155, 155, 81);
    }

    .abv {
        width: 10px;
        background-color: bisque;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        text-align: center;
    }

    tfoot {
    background-color: aqua;
    font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

    tfoot tr th{
        width: 100px;
    }

    tfoot td {
        background-color:rgb(177, 247, 177)
    }


</style>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES 
            TABLE
                THEAD
                    TR, TD, TH

                TBODY
                    TR, TD, TH
                
                TFOOT
                    TR, TD, TH
    -->
    

    <!-- 
        SEMPRE QUE FOR UM DADO = TD
        SEMPRE QUE FOR UM TITULO = TH

        SE OS DADOS ESTIVEREM NA COLUNA ABAIXO ==== SCOPE="COL"
        SE OS DADOS ESTIVEREM NA MESMA LINHA === SCOPE="ROW"

        TITULO DA COLUNA = SCOPE="COL"

        TITULO DA LINHA = SCOPE="ROW"
    
    -->
    <table>

        <caption>
            População das unidades federativas kiiri
        </caption>
        <thead>
            <th scope="col" class="est">Estado </th>
            <th scope="col" class="pop">População </th>
            <th scope="col">Abreviação </th>
        </thead>

        <tbody>
          <tr>
                <td>Brasília</td>
                <td class="numero">190238</td>
                <TD class="abv">BSB</TD>
          </tr>

          <tr>
            <td>São Paulo</td>
            <td class="numero">123123</td>
            <td class="abv"> SP</td>
          </tr>

          <tr>
            <td>Rio de Janeiro</td>
            <td class ="numero">232314</td>
            <td class="abv">RJ</td>
          </tr>

          <tr>
            <td>Belo Horizonte</td>
            <td class="numero">1231233</td>
            <td class="abv">BH</td>
          </tr>

          <tr>
            <td>Estados Unidos</td>
            <td class="numero">213123123</td>
            <td class="abv">USA</td>
          </tr>
        </tbody>
        
        <tfoot> 
            <tr>
                <th scope="col">Total de Estados</th>
                <th scope="col">População Total</th>
                <th scope="col">PIB</th>
            </tr> 

            <tr>
                <td>5</td>
                <td>sim</td>
                <td>bastante</td>
            </tr>

            <tr>
                <TH scope="row">testezudo</TH>
                <td>testado</td>
                <td>kiri</td>   
            </tr>

        </tfoot>

        
    </table>
</body>
</html>
