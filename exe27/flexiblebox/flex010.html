<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            display: flex;
            background-color: salmon;
            flex-flow: row nowrap;
            align-items: stretch;

            
        }

        div.item {
            background-color: lightcyan;
            border: 1px solid black;
            
            text-align:center;
            
            padding: 15px;

            flex-basis: 100px;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">esse item é maior</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">esse tambem é maior</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">e esse tambem é </div>
        <div class="item" id="i8">H</div>
 
    </div>
    
</body>
</html>
