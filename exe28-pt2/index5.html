<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> grid-rows</title>
</head>
<style>
    .container{
        display: grid;
        grid-template: repeat(3, 100px) / repeat(4, 1fr);
        border:1px solid black;

        gap: 10px;
    }
    .caixa1 {
        grid-row-start: 2;
        grid-row-end: 2;

        grid-column-start: 3;
        grid-column-end: 4;

        background-color: rgb(0, 255, 255);
    }

    .caixa2{
        grid-row-start:1;
        grid-row-end: 2;

        grid-column-start: 2;
        grid-column-end: 3;

        background-color: rgb(255, 0, 255);
    }

    .caixa3{
        grid-row-start:1;
        grid-row-end: 4;

        grid-column-start: 4;
        grid-column-end: -1;

        background-color: rgb(255, 255, 0);
    }

    .caixa4{ 
        grid-row-start:1;
        grid-row-end: 4;

        grid-column-start: 1;
        grid-column-end: 1;



        background-color: rgb(0, 255, 0);
    }
</style>
<body>

    <div class="container">
        <div class="caixa1"></div>
        <div class="caixa2"></div>
        <div class="caixa3"></div>
        <div class="caixa4"></div>
    </div>
    
</body>
</html>
