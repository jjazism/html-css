<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>

    <p>
        <label for="inome">Nome </label>
        <input type="text" name="nome" id="inome">
    </p>

    <p>
        <label for="imedia">Media</label>
        <input type="number" name="media" id="imedia" min="0" max="10" required placeholder="0 a 10" step="0.1" value="5">
    </p>

    <p>
        <label for="iletivo">Periodo Letivo</label>
        <input type="month" name="letivo" id="iletivo" required value="2025-24-12">
    </p>

    <p>
        <label for="iprova">Dia da Prova</label>
        <input type="date" name="prova" id="iprova" required value="2025-12-25">
    </p>

    <p>
        <label for="ihora">horário da prova</label>
        <input type="time" name="hora" id="ihora" required value="18:00">
    </p>

    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>
</body>
</html>
