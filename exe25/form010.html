<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>exemplo de formulário</h1>

    <form action="cadastro.php" method="get">
        <p>
            <label for="iano">Ano Nascimento :</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" required oninput="calcIdade()">
        </p>
        
        <p>
            <label for="iidade">Sua idade :</label>
            <output id="iidade">0</output>
        
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
