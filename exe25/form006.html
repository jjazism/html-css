<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>

    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="icor">Cor :</label>
            <input type="color" name="cor" id="icor" value="#000000">
        </p>

        <p>
            <label for="inivel">Nível de Satisfação</label>
            <input type="range" name="nivel" id="inivel"  min="1" max="10" value="5">
        </p>

        <p>
            <label for="ifoto">Envie um Arquivo</label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <!--   arquivos com mais de 3000kb usar method post -->


        <input type="submit" value="Enviar"> <br> <br>
        
        <input type="reset" value="Limpar">




    </form>
    
</body>
</html>
