<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionando Conteudos com iframe</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: lightsteelblue;
    }
    h1 {
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        padding: 15px;
    }

    iframe{
        display:flex;
        margin: auto;
        border: 1px dashed black;
    }
    h1, h2 , p {
        text-align: center;
    }
</style>
<body>
        <h1>Conteudo dentro de iframes</h1>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Iure voluptate qui, fugiat unde a veniam?</p>

        <h2>Videos</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/zG5gWncAhls?si=smnh9uUQ5JV_yaVx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <h2>Maps</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3842.279997094957!2d-47.831279174044454!3d-15.630071418931895!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x935a40c40d64bfc7%3A0x363f1013cb29cae5!2sSH%20Mans%C3%B5es%20Sobradinho%20Condom%C3%ADnio%20Mini-Ch%C3%A1caras%20QMS%2037%20-%20Sobradinho%20II%2C%20Bras%C3%ADlia%20-%20DF!5e0!3m2!1sen!2sbr!4v1764712675613!5m2!1sen!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <h2>waze</h2>
        <iframe src="https://embed.waze.com/iframe?zoom=16&lat=-15.630336&lon=-47.821619&ct=livemap" width="600" height="450" allowfullscreen></iframe>

        <h2>Documents</h2>
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQEw93fPMwW5FtUJHNPz57ziDIEYwQcK1Mli7tofQijoAX2Qxy9hD1CU6nLJJJGhpvewu39zjUZPGxS/pubembed?start=false&loop=true&delayms=3000" frameborder="0" width="480" height="299" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
</body>
</html>
